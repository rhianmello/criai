name: CRIAI production browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/remote_smoke.py"
      - ".github/workflows/remote-acceptance.yml"
      - "index.html"
      - "leadlovers.html"
      - "sobre.html"
      - "privacidade.html"
      - "assets/**"
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check public HTTPS, browser, mobile and link format
        run: python tests/remote_smoke.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criai-remote-acceptance
          path: test-results/
          if-no-files-found: ignore
