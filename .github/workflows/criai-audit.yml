name: CRIAI site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML, links, canonical domain and consent markers
        run: |
          python3 tests/site_check.py
          python3 tests/admin_check.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/config.js
          node --check admin/painel.js
